<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Control Panel</title>
    <style>
        /* Gaya Dasar & Mobile-First */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 0;
            padding-bottom: 80px; /* Memberi ruang untuk tombol mengambang di bawah */
        }
        
        .container { 
            max-width: 100%; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #ccc; font-size: 14px; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #444; 
            border-radius: 8px; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; /* Mencegah auto-zoom di iPhone */
            box-sizing: border-box; 
        }

        .status-box { 
            padding: 15px; 
            text-align: center; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-weight: bold;
            font-size: 14px;
        }
        .on { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.3); }
        .off { background: rgba(255, 0, 0, 0.15); color: #ff4d4d; border: 1px solid rgba(255, 0, 0, 0.3); }
        
        .box-section { 
            background: #1e1e1e; 
            padding: 20px 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .box-title { 
            color: #00d2ff; 
            margin-top: 0; 
            margin-bottom: 20px; 
            font-size: 16px; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flex-row { display: flex; gap: 12px; }
        .flex-row .form-group { flex: 1; }

        /* Gaya Tombol Mengambang (Floating Action Button Area) */
        .floating-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-top: 1px solid #333;
            z-index: 1000;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        .floating-action button { 
            width: 100%; 
            padding: 16px; 
            background: #00d2ff; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .floating-action button:active { background: #0096c7; transform: scale(0.98); }

        /* Loader Ringan */
        #loader { display: none; text-align: center; color: #00d2ff; font-size: 14px; margin-top: 5px;}
    </style>
</head>
<body>

<div class="container">
    
    <div id="statusIndicator" class="status-box on">Menghubungkan ke Cloudflare...</div>

    <div class="box-section">
        <h4 class="box-title">Kontrol Utama</h4>
        <div class="form-group">
            <label>Status Bot (Kill Switch)</label>
            <select id="bot_status">
                <option value="1">🟢 ON (Trading Aktif)</option>
                <option value="0">🔴 OFF (Hentikan Bot)</option>
            </select>
        </div>
        <div class="flex-row">
            <div class="form-group"><label>EMA Period</label><input type="number" id="ema" /></div>
            <div class="form-group"><label>Lot Size</label><input type="number" step="0.01" id="lot" /></div>
        </div>
        <div class="flex-row">
            <div class="form-group"><label>Max Sinyal</label><input type="number" id="max_signals" /></div>
            <div class="form-group"><label>Jumlah Entry</label><input type="number" id="tps" /></div>
        </div>
        <div class="flex-row">
            <div class="form-group"><label>Stop Loss ($)</label><input type="number" step="0.1" id="sl" /></div>
            <div class="form-group"><label>Take Profit ($)</label><input type="number" step="0.1" id="tp" /></div>
        </div>
    </div>

    <div class="box-section">
        <h4 class="box-title">Trailing Stop ($)</h4>
        <div class="form-group">
            <label>Status Trailing Stop</label>
            <select id="use_trailing">
                <option value="1">✅ Aktif</option>
                <option value="0">❌ Mati</option>
            </select>
        </div>
        <div class="flex-row"><div class="form-group"><label>Trigger 1</label><input type="number" id="tt1"></div><div class="form-group"><label>Lock 1</label><input type="number" id="tl1"></div></div>
        <div class="flex-row"><div class="form-group"><label>Trigger 2</label><input type="number" id="tt2"></div><div class="form-group"><label>Lock 2</label><input type="number" id="tl2"></div></div>
        <div class="flex-row"><div class="form-group"><label>Trigger 3</label><input type="number" id="tt3"></div><div class="form-group"><label>Lock 3</label><input type="number" id="tl3"></div></div>
        <div class="flex-row"><div class="form-group"><label>Trigger 4</label><input type="number" id="tt4"></div><div class="form-group"><label>Lock 4</label><input type="number" id="tl4"></div></div>
        <div class="flex-row"><div class="form-group"><label>Trigger 5</label><input type="number" id="tt5"></div><div class="form-group"><label>Lock 5</label><input type="number" id="tl5"></div></div>
    </div>
</div>

<!-- TOMBOL MENGAMBANG DI BAWAH -->
<div class="floating-action">
    <button onclick="saveSettings()">SIMPAN PENGATURAN</button>
    <div id="loader">Menyimpan...</div>
</div>

<script>
    const WORKER_URL = "https://small-snowflake-c1bc.goedangbarang96.workers.dev";

    async function loadSettings() {
        try {
            const res = await fetch(WORKER_URL);
            const data = await res.json();
            
            document.getElementById('bot_status').value = data.status;
            document.getElementById('ema').value = data.ema;
            document.getElementById('lot').value = data.lot;
            document.getElementById('tp').value = data.tp;
            document.getElementById('sl').value = data.sl;
            document.getElementById('max_signals').value = data.max_signals;
            document.getElementById('tps').value = data.trades_per_signal;
            document.getElementById('use_trailing').value = data.use_trailing;
            
            for(let i=1; i<=5; i++){
                document.getElementById('tt'+i).value = data['tt'+i];
                document.getElementById('tl'+i).value = data['tl'+i];
            }
            updateIndicator(data.status);
        } catch (e) { 
            const box = document.getElementById('statusIndicator');
            box.className = "status-box off"; 
            box.innerText = "Gagal memuat data dari Cloudflare."; 
        }
    }

    async function saveSettings() {
        document.getElementById('loader').style.display = 'block';
        const payload = {
            status: parseInt(document.getElementById('bot_status').value),
            ema: parseInt(document.getElementById('ema').value),
            lot: parseFloat(document.getElementById('lot').value),
            tp: parseFloat(document.getElementById('tp').value),
            sl: parseFloat(document.getElementById('sl').value),
            max_signals: parseInt(document.getElementById('max_signals').value),
            trades_per_signal: parseInt(document.getElementById('tps').value),
            use_trailing: parseInt(document.getElementById('use_trailing').value)
        };
        for(let i=1; i<=5; i++){
            payload['tt'+i] = parseFloat(document.getElementById('tt'+i).value);
            payload['tl'+i] = parseFloat(document.getElementById('tl'+i).value);
        }

        try {
            const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.success) {
                updateIndicator(payload.status);
                alert("Berhasil! Bot MT5 akan menyesuaikan secara otomatis.");
            }
        } catch (e) { 
            alert("Gagal menyimpan data! Periksa koneksi."); 
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function updateIndicator(status) {
        const box = document.getElementById('statusIndicator');
        if(status === 1) { box.className = "status-box on"; box.innerText = "BOT AKTIF 🟢"; } 
        else { box.className = "status-box off"; box.innerText = "BOT DIMATIKAN 🔴"; }
    }

    loadSettings();
</script>
</body>
</html>
